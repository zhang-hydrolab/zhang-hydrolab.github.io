name: CI

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Back-end tests
        run: npm test
        working-directory: backend
      - name: Build the site and check every link
        run: node scripts/publish.mjs --build-only
